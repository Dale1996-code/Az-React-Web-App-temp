# SECONDARY / ALTERNATIVE PIPELINE — prefer GitHub Actions.
#
# This Azure DevOps pipeline exists for teams that cannot use GitHub Actions.
# The canonical CI/CD path is .github/workflows/azure-dev.yml.
#
# PARITY DECISION (Phase 4):
#   Two low-cost quality gates were added here to match GitHub Actions:
#     ✓ OpenAPI spec sync check  (added)
#     ✓ API unit/integration tests  (added)
#
#   The following steps remain intentionally absent because they require
#   infrastructure outputs that are unavailable before azd provision runs,
#   or involve tooling that is impractical to wire into a minimal ADO pipeline.
#   Add them here only if this pipeline becomes your primary production path.
#
#   STILL MISSING vs GitHub Actions:
#     - Frontend build step (npm ci && npm run build in src/web)
#         Reason: the web build requires VITE_API_BASE_URL from azd provision
#         output, which is unavailable for a pre-provision validation pass.
#         Pre-provision type-checking can be added if needed (npm run build
#         with a placeholder VITE_API_BASE_URL), but was deferred to keep
#         this pipeline minimal.
#     - Playwright smoke tests against the deployed app
#         Reason: requires SERVICE_WEB_URI and SERVICE_API_URI from azd
#         provision output and a deployed Playwright-capable agent. Not
#         practical without a dedicated test stage or agent pool.
#         NOTE: the Playwright suite now includes an authenticated smoke check
#         for GET /dashboard (using a service-principal token via OAuth2 client
#         credentials).  When you add Playwright here, also add the four
#         pipeline variables/secrets:
#           SMOKE_AZURE_TENANT_ID, SMOKE_AZURE_CLIENT_ID,
#           SMOKE_AZURE_CLIENT_SECRET, SMOKE_AZURE_API_SCOPE
#         Without them the authenticated test is skipped (non-blocking).
#     - Playwright report artifact upload
#         Reason: depends on the above smoke test step.
#
# Run when commits are pushed to mainline branch (main or master)
# Set this to the mainline branch you are using
trigger:
  - main
  - master

# Azure Pipelines workflow to deploy to Azure using azd
# To configure required secrets and service connection for connecting to Azure, simply run `azd pipeline config --provider azdo`
# Task "Install azd" needs to install setup-azd extension for azdo - https://marketplace.visualstudio.com/items?itemName=ms-azuretools.azd
# See below for alternative task to install azd if you can't install above task in your organization

pool:
  vmImage: ubuntu-latest

steps:
  - task: setup-azd@1
    displayName: Install azd

  # If you can't install above task in your organization, you can comment it and uncomment below task to install azd
  # - task: Bash@3
  #   displayName: Install azd
  #   inputs:
  #     targetType: 'inline'
  #     script: |
  #       curl -fsSL https://aka.ms/install-azd.sh | bash

  # azd delegate auth to az to use service connection with AzureCLI@2
  - pwsh: |
      azd config set auth.useAzCliAuth "true"
    displayName: Configure AZD to Use AZ CLI Authentication.

  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '22.x'

  - task: Bash@3
    displayName: Verify OpenAPI spec sync
    inputs:
      targetType: 'inline'
      script: |
        if ! diff src/api/openapi.yaml openapi.yaml > /dev/null 2>&1; then
          echo "##vso[task.logissue type=error]openapi.yaml (root) is out of sync with src/api/openapi.yaml (source of truth)."
          echo "Run: cp src/api/openapi.yaml openapi.yaml && git add openapi.yaml && git commit -m 'chore: sync root openapi.yaml'"
          diff src/api/openapi.yaml openapi.yaml || true
          exit 1
        fi
        echo "OpenAPI spec sync check passed."

  - task: Bash@3
    displayName: Install API dependencies and run tests
    inputs:
      targetType: 'inline'
      script: |
        cd src/api
        npm ci
        npm test
    env:
      NODE_ENV: test

  - task: Bash@3
    displayName: Build API
    inputs:
      targetType: 'inline'
      script: |
        cd src/api
        npm run build

  - task: AzureCLI@2
    displayName: Provision Infrastructure
    inputs:
      azureSubscription: azconnection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        azd provision --no-prompt
    env:
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
      AZURE_ENV_NAME: $(AZURE_ENV_NAME)
      AZURE_LOCATION: $(AZURE_LOCATION)
      AZD_INITIAL_ENVIRONMENT_CONFIG: $(secrets.AZD_INITIAL_ENVIRONMENT_CONFIG)

  - task: AzureCLI@2
    displayName: Deploy Application
    inputs:
      azureSubscription: azconnection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        azd deploy --no-prompt
    env:
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
      AZURE_ENV_NAME: $(AZURE_ENV_NAME)
      AZURE_LOCATION: $(AZURE_LOCATION)
