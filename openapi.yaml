            schema: { $ref: "#/components/schemas/Task" }
      responses:
        "201":
          description: Task created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get task by id
      tags: [Tasks]
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Task" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete task
      tags: [Tasks]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Productivity ----------
  /productivity:
    get:
      summary: List productivity records
      tags: [Productivity]
      parameters:
        - $ref: "#/components/parameters/top"
        - $ref: "#/components/parameters/skip"
      responses:
        "200":
          description: Array of productivity records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductivityRecord" }
    post:
      summary: Create productivity record
      tags: [Productivity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductivityRecord" }
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductivityRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /productivity/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get productivity record by id
      tags: [Productivity]
      responses:
        "200":
          description: Productivity record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductivityRecord" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update productivity record
      tags: [Productivity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductivityRecord" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductivityRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete productivity record
      tags: [Productivity]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Coaching ----------
  /coaching:
    get:
      summary: List coaching records
      tags: [Coaching]
      parameters:
        - $ref: "#/components/parameters/top"
        - $ref: "#/components/parameters/skip"
      responses:
        "200":
          description: Array of coaching records
          content:
