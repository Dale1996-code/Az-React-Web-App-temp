openapi: 3.0.0
info:
  description: Dales Operations API — store operations and shift management
  version: 0.2.0
  title: Dales Operations API
  contact:
    email: noreply@example.com

# All business endpoints require a Bearer JWT from Azure Entra ID.
# /health is open (no auth) for deployment probes.
# In development/test (NODE_ENV ≠ production) the auth check is bypassed automatically.
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Azure Entra ID Bearer JWT. Set AZURE_AD_TENANT_ID and AZURE_AD_CLIENT_ID
        on the API App Service. Bypassed automatically when NODE_ENV is not "production"
        (local dev and tests). See src/api/README.md for configuration details.

  schemas:

    # ── Error shape ─────────────────────────────────────────────────────────────
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items: { type: string }
          example: ["storeDate is required and must be YYYY-MM-DD.", "shiftLabel is required."]

    # ── Enums ────────────────────────────────────────────────────────────────────
    TaskStatus:
      type: string
      enum: [notStarted, inProgress, completed]

    TaskPriority:
      type: string
      enum: [low, medium, high]

    IssueStatus:
      type: string
      enum: [open, resolved]

    # ── Employee ─────────────────────────────────────────────────────────────────
    Employee:
      type: object
      required:
        - firstName
        - lastName
        - role
        - isActive
      properties:
        id:           { type: string, readOnly: true }
        firstName:    { type: string, minLength: 1, maxLength: 100 }
        lastName:     { type: string, minLength: 1, maxLength: 100 }
        role:         { type: string, minLength: 1, maxLength: 100 }
        isActive:     { type: boolean }
        department:   { type: string, maxLength: 100 }
        employeeCode: { type: string, maxLength: 50 }
        notes:        { type: string, maxLength: 500 }
        createdDate:  { type: string, format: date-time, readOnly: true }
        updatedDate:  { type: string, format: date-time, readOnly: true }

    # ── Task ─────────────────────────────────────────────────────────────────────
    Task:
      type: object
      required:
        - title
        - status
        - storeDate
        - department
      properties:
        id:                  { type: string, readOnly: true }
        title:               { type: string, minLength: 1, maxLength: 200 }
        status:              { $ref: "#/components/schemas/TaskStatus" }
        storeDate:           { type: string, format: date, example: "2026-04-14" }
        department:          { type: string, minLength: 1, maxLength: 100 }
        assignedEmployeeId:  { type: string }
        description:         { type: string, maxLength: 1000 }
        priority:            { $ref: "#/components/schemas/TaskPriority" }
        dueTime:             { type: string, pattern: "^\\d{2}:\\d{2}$", example: "14:30" }
        notes:               { type: string, maxLength: 1000 }
        completedAt:         { type: string, format: date-time }
        createdDate:         { type: string, format: date-time, readOnly: true }
        updatedDate:         { type: string, format: date-time, readOnly: true }

    # ── ProductivityRecord ───────────────────────────────────────────────────────
    ProductivityRecord:
      type: object
      required:
        - employeeId
        - storeDate
      properties:
        id:                   { type: string, readOnly: true }
        employeeId:           { type: string }
        storeDate:            { type: string, format: date, example: "2026-04-14" }
        freightStockedUnits:  { type: number, minimum: 0 }
        breakMinutes:         { type: number, minimum: 0 }
        zonesCovered:         { type: string }
        overstockNotes:       { type: string }
        shiftNotes:           { type: string }
        createdDate:          { type: string, format: date-time, readOnly: true }
        updatedDate:          { type: string, format: date-time, readOnly: true }

    # ── CoachingRecord ───────────────────────────────────────────────────────────
    CoachingRecord:
      type: object
      required:
        - employeeId
        - storeDate
        - topic
      properties:
        id:              { type: string, readOnly: true }
        employeeId:      { type: string }
        storeDate:       { type: string, format: date, example: "2026-04-14" }
        topic:           { type: string, minLength: 1 }
        issues:
          type: array
          items: { type: string }
        goals:           { type: string }
        followUpDate:    { type: string, format: date, example: "2026-04-21" }
        acknowledgement: { type: string }
        status:          { type: string }
        createdDate:     { type: string, format: date-time, readOnly: true }
        updatedDate:     { type: string, format: date-time, readOnly: true }

    # ── IssueLog ─────────────────────────────────────────────────────────────────
    IssueLog:
      type: object
      required:
        - storeDate
        - category
        - status
        - department
        - description
      properties:
        id:                    { type: string, readOnly: true }
        storeDate:             { type: string, format: date, example: "2026-04-14" }
        category:              { type: string, minLength: 1 }
        status:                { $ref: "#/components/schemas/IssueStatus" }
        department:            { type: string, minLength: 1 }
        description:           { type: string, minLength: 1 }
        reportedByEmployeeId:  { type: string }
        resolvedAt:            { type: string, format: date-time }
        resolutionNotes:       { type: string }
        createdDate:           { type: string, format: date-time, readOnly: true }
        updatedDate:           { type: string, format: date-time, readOnly: true }

    # ── DailySummary ─────────────────────────────────────────────────────────────
    DailySummary:
      type: object
      required:
        - storeDate
        - shiftLabel
      properties:
        id:                { type: string, readOnly: true }
        storeDate:         { type: string, format: date, example: "2026-04-14" }
        shiftLabel:        { type: string, minLength: 1, example: "closing" }
        completedWork:     { type: string }
        missedWork:        { type: string }
        followUpItems:     { type: string }
        generalNotes:      { type: string }
        authorEmployeeId:  { type: string }
        createdDate:       { type: string, format: date-time, readOnly: true }
        updatedDate:       { type: string, format: date-time, readOnly: true }

  parameters:
    id:
      in: path
      required: true
      name: id
      description: Unique identifier
      schema: { type: string }
    top:
      in: query
      required: false
      name: top
      description: Max number of items to return
      schema: { type: number, default: 100 }
    skip:
      in: query
      required: false
      name: skip
      description: Number of items to skip
      schema: { type: number, default: 0 }

  responses:
    ValidationError:
      description: Validation failed — one or more required fields missing or malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found.
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  headers:
    Location:
      description: Relative URL of the newly created resource (e.g. `/employees/<id>`).
      schema: { type: string }

paths:
  # ---------- System ----------
  /health:
    get:
      summary: Health check
      description: Returns API health status. Used by Azure App Service deployment probes.
      tags: [System]
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, env]
                properties:
                  status:    { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }
                  env:       { type: string, example: "production" }

  # ---------- Dashboard ----------
  /dashboard:
    get:
      summary: Get shift-day dashboard summary
      description: >
        Returns aggregated counts and recent items for a single shift day.
        All counts span the full dataset; urgentTasks and recentOpenIssues are
        capped at 5 items each.
      tags: [Dashboard]
      parameters:
        - name: date
          in: query
          description: Target date (YYYY-MM-DD). Defaults to today.
          schema: { type: string, format: date, example: "2026-04-15" }
      responses:
        "200":
          description: Dashboard summary counts
          content:
            application/json:
              schema:
                type: object
                required: [date, taskCounts, openIssuesCount, coachingFollowUpsDueCount, activeEmployeesCount]
                properties:
                  date:
                    type: string
                    format: date
                    example: "2026-04-15"
                  taskCounts:
                    type: object
                    required: [notStarted, inProgress, completed]
                    properties:
                      notStarted: { type: integer, minimum: 0 }
                      inProgress: { type: integer, minimum: 0 }
                      completed:  { type: integer, minimum: 0 }
                  openIssuesCount:
                    type: integer
                    minimum: 0
                  coachingFollowUpsDueCount:
                    type: integer
                    minimum: 0
                  activeEmployeesCount:
                    type: integer
                    minimum: 0
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------- Employees ----------
  /employees:
    get:
      summary: List employees
      tags: [Employees]
      parameters:
        - $ref: "#/components/parameters/top"
        - $ref: "#/components/parameters/skip"
      responses:
        "200":
          description: Array of employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      summary: Create employee
      tags: [Employees]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Employee" }
      responses:
        "201":
          description: Employee created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /employees/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get employee by id
      tags: [Employees]
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update employee
      tags: [Employees]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Employee" }
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete employee
      tags: [Employees]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Tasks ----------
  /tasks:
    get:
      summary: List tasks
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/top"
        - $ref: "#/components/parameters/skip"
      responses:
        "200":
          description: Array of tasks
          content:
