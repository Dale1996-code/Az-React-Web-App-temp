openapi: 3.0.0
info:
  description: Dales Operations API — store operations and shift management
  version: 0.1.0
  title: Dales Operations API
  contact:
    email: noreply@example.com

components:
  schemas:
    Employee:
      type: object
      required:
        - name
        - role
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        department: { type: string }
        notes: { type: string }
        createdDate: { type: string, format: date-time }
        updatedDate: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [notStarted, inProgress, completed]

    Task:
      type: object
      required:
        - title
        - status
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        assignedToEmployeeId: { type: string }
        department: { type: string }
        dueDate: { type: string, format: date }
        notes: { type: string }
        createdDate: { type: string, format: date-time }
        updatedDate: { type: string, format: date-time }

    ProductivityRecord:
      type: object
      required:
        - employeeId
        - date
      properties:
        id: { type: string }
        employeeId: { type: string }
        date: { type: string, format: date }
        freightStocked: { type: number }
        breakDurationMinutes: { type: number }
        zonedAreas: { type: string }
        overstockNotes: { type: string }
        shiftNotes: { type: string }
        createdDate: { type: string, format: date-time }
        updatedDate: { type: string, format: date-time }

    CoachingRecord:
      type: object
      required:
        - employeeId
        - date
      properties:
        id: { type: string }
        employeeId: { type: string }
        date: { type: string, format: date }
        issues:
          type: array
          items: { type: string }
        goals: { type: string }
        followUpDate: { type: string, format: date }
        acknowledgement: { type: string }
        createdDate: { type: string, format: date-time }
        updatedDate: { type: string, format: date-time }

    IssueStatus:
      type: string
      enum: [open, resolved]

    IssueLog:
      type: object
      required:
        - type
        - status
        - date
      properties:
        id: { type: string }
        type: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        date: { type: string, format: date }
        notes: { type: string }
        department: { type: string }
        createdDate: { type: string, format: date-time }
        updatedDate: { type: string, format: date-time }

    DailySummary:
      type: object
      required:
        - date
      properties:
        id: { type: string }
        date: { type: string, format: date }
        completedWork: { type: string }
        missedWork: { type: string }
        followUpItems: { type: string }
        generalNotes: { type: string }
        createdDate: { type: string, format: date-time }
        updatedDate: { type: string, format: date-time }

  parameters:
    id:
      in: path
      required: true
      name: id
      description: Unique identifier
      schema: { type: string }
    top:
      in: query
      required: false
      name: top
      description: Max number of items to return
      schema: { type: number, default: 100 }
    skip:
      in: query
      required: false
      name: skip
      description: Number of items to skip
      schema: { type: number, default: 0 }

paths:
  # ---------- Employees ----------
  /employees:
    get:
      summary: List employees
      tags: [Employees]
      parameters:
        - $ref: "#/components/parameters/top"
        - $ref: "#/components/parameters/skip"
      responses:
        "200":
          description: Array of employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      summary: Create employee
      tags: [Employees]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Employee" }
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /employees/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get employee by id
      tags: [Employees]
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404": { description: Not found }
    put:
      summary: Update employee
      tags: [Employees]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Employee" }
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404": { description: Not found }
    delete:
      summary: Delete employee
      tags: [Employees]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

