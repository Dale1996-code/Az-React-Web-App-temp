              schema: { $ref: "#/components/schemas/CoachingRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete coaching record
      tags: [Coaching]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Issues ----------
  /issues:
    get:
      summary: List issue log entries
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/top"
        - $ref: "#/components/parameters/skip"
      responses:
