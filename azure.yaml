# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: dales-operations
metadata:
  template: dales-operations@0.1.0
workflows:
  up: 
    steps:
      - azd: provision
      - azd: deploy --all
services:
  web:
    project: ./src/web
    dist: dist
    language: js
    host: appservice
    hooks:
      # prepackage: write VITE_* env vars from Bicep outputs into .env.local so Vite
      # bakes them into the bundle, then install deps and build. This is the
      # authoritative web build step — it runs for both `azd up` (local) and
      # `azd deploy` (CI), ensuring the correct API URL is always embedded.
      # .env.local is git-ignored and removed in postdeploy.
      # see: https://vitejs.dev/guide/env-and-mode
      prepackage:
        windows:
          shell: pwsh
          run: |
            echo "VITE_API_BASE_URL=""$env:API_BASE_URL""" > .env.local
            echo "VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=""$env:APPLICATIONINSIGHTS_CONNECTION_STRING""" >> .env.local
            npm ci
            npm run build
        posix:
          shell: sh
          run: |
            echo VITE_API_BASE_URL=\"$API_BASE_URL\" > .env.local
            echo VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=\"$APPLICATIONINSIGHTS_CONNECTION_STRING\" >> .env.local
            npm ci
            npm run build
      postdeploy:
        windows:
          shell: pwsh
          run: 'rm .env.local'
        posix:
          shell: sh
          run: 'rm .env.local'
  api:
    project: ./src/api
    language: js
    host: appservice
    hooks:
      # prepackage: install deps (incl. dev), compile TypeScript (tsc → dist/),
      # then prune devDependencies so the deployed artifact is production-only.
      # `--include=dev` is required because azd/App Service runs the hook with
      # NODE_ENV=production, which would otherwise cause `npm ci` to skip
      # devDependencies (typescript, @types/node) and break the build.
      # This is the authoritative API build step — required for both `azd up`
      # (local clean checkout) and `azd deploy` (CI), because App Service runs
      # `node .` which resolves main=dist/index.js and expects compiled output.
      prepackage:
        windows:
          shell: pwsh
          run: |
            npm ci --include=dev
            npm run build
            npm prune --omit=dev
        posix:
          shell: sh
          run: 'npm ci --include=dev && npm run build && npm prune --omit=dev'
