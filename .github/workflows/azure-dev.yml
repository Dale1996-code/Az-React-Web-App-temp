# PRIMARY CI/CD PIPELINE — use this path by default.
#
# This workflow is the canonical deployment path for this repository.
# The Azure DevOps pipeline at .azdo/pipelines/azure-dev.yml is a secondary
# alternative for teams that cannot use GitHub Actions; it intentionally skips
# API tests, the web build step, and Playwright smoke tests to stay minimal.
# If you need both pipelines, bring the ADO one to parity rather than letting
# this one fall behind.
#
# Build responsibility:
#   The authoritative builds happen inside azd's prepackage hooks (azure.yaml),
#   which run as part of `azd deploy`. This means `azd up` / `azd deploy` from
#   a clean local checkout is fully self-contained — no pre-built artifacts needed.
#
#   The explicit "Build API" and "Build frontend" steps below run BEFORE provision
#   as early validation: they catch compilation or lint failures fast, before the
#   expensive provision step. azd then rebuilds both services inside its prepackage
#   hooks (after provision, so the web gets the correct VITE_API_BASE_URL).
#
# Steps run here (ADO equivalents noted where absent):
#   1. API unit/integration tests       ← ADO SKIPS
#   2. API build validation (tsc)       ← early fail-fast; azd hook rebuilds for deploy
#   3. Web build validation (vite)      ← ADO SKIPS; early fail-fast only
#   4. azd provision
#   5. azd deploy  (prepackage hooks build both services with correct env vars)
#   6. Playwright smoke tests           ← ADO SKIPS
#   7. Upload Playwright report         ← ADO SKIPS

on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main
      - master

# GitHub Actions workflow to deploy to Azure using azd
# To configure required secrets for connecting to Azure, simply run `azd pipeline config`

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2
      
      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify OpenAPI spec sync
        # src/api/openapi.yaml is the source of truth.
        # The root openapi.yaml must be an exact copy (kept for tooling discovery).
        # To fix a failure here: cp src/api/openapi.yaml openapi.yaml && git commit
        run: |
          if ! diff src/api/openapi.yaml openapi.yaml > /dev/null 2>&1; then
            echo "::error::openapi.yaml (root) is out of sync with src/api/openapi.yaml (source of truth)."
            echo "Run: cp src/api/openapi.yaml openapi.yaml && git add openapi.yaml && git commit -m 'chore: sync root openapi.yaml'"
            diff src/api/openapi.yaml openapi.yaml || true
            exit 1
          fi
          echo "OpenAPI spec sync check passed."

      - name: Install API dependencies and run tests
        run: |
          cd src/api
          npm ci
          npm test
        env:
          NODE_ENV: test

      - name: Build API
        run: |
          cd src/api
          npm run build

      - name: Prune API devDependencies
        run: |
          cd src/api
          npm prune --omit=dev

      - name: Build frontend
        run: |
          cd src/web
          npm ci
          npm run build

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Log in with Azure (Client Credentials)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        run: |
          $info = $Env:AZURE_CREDENTIALS | ConvertFrom-Json -AsHashtable;
          Write-Host "::add-mask::$($info.clientSecret)"

          azd auth login `
            --client-id "$($info.clientId)" `
            --client-secret "$($info.clientSecret)" `
            --tenant-id "$($info.tenantId)"
        shell: pwsh
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Override App Service Plan SKU
        # AZD_INITIAL_ENVIRONMENT_CONFIG was generated when the default SKU was B1.
        # It persists APP_SERVICE_PLAN_SKU_NAME=B1 in the azd env, overriding the
        # =F1 default in main.parameters.json. Force F1 so that quota-constrained
        # subscriptions (Basic VM quota = 0) can provision successfully.
        # To use a higher tier, set the APP_SERVICE_PLAN_SKU_NAME repo variable.
        run: azd env set APP_SERVICE_PLAN_SKU_NAME "${{ vars.APP_SERVICE_PLAN_SKU_NAME || 'F1' }}"
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
          
      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Playwright dependencies
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke tests against deployed app
        # Smoke tests validate:
        #   - All 7 route shells render (auth-agnostic; accept loading/empty/list states)
        #   - GET /health returns 200 (always unauthenticated)
        #   - Frontend reaches the API (/dashboard returns 200 or 401; both confirm reachability)
        #   - Authenticated GET /dashboard returns 200 with valid body shape (when SMOKE_AZURE_*
        #     secrets are configured — skipped otherwise with a visible reason in the report)
        #
        # Authenticated smoke check (blocking when secrets are present):
        #   Requires four repository secrets:
        #     SMOKE_AZURE_TENANT_ID      — Entra ID tenant ID
        #     SMOKE_AZURE_CLIENT_ID      — service-principal application (client) ID
        #     SMOKE_AZURE_CLIENT_SECRET  — service-principal client secret
        #     SMOKE_AZURE_API_SCOPE      — e.g. api://<api-client-id>/.default
        #
        #   The service principal must have the API permission for the above scope granted
        #   (admin consent or user consent) in your Entra ID tenant.
        #   The client secret is passed as a GitHub secret and is never echoed in logs.
        run: |
          AZD_ENV=$(azd env get-values)
          WEB_URL=$(echo "$AZD_ENV" | grep '^SERVICE_WEB_URI=' | cut -d'=' -f2- | tr -d '"')
          API_URL=$(echo "$AZD_ENV" | grep '^SERVICE_API_URI=' | cut -d'=' -f2- | tr -d '"')
          if [ -z "$WEB_URL" ]; then
            echo "::error::SERVICE_WEB_URI not found in azd environment — check that azd provision succeeded"
            exit 1
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::SERVICE_API_URI not found in azd environment — API connectivity checks will fail"
            exit 1
          fi
          echo "Smoke testing web: $WEB_URL"
          echo "Smoke testing API: $API_URL"
          cd tests
          REACT_APP_WEB_BASE_URL="$WEB_URL" REACT_APP_API_BASE_URL="$API_URL" npx playwright test
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CI: "true"
          # Authenticated smoke check secrets — configure these to enable the blocking auth gate.
          # If absent, the authenticated test is skipped (non-blocking) and a reason is shown in
          # the Playwright report.  Add them as repository secrets in Settings → Secrets and variables.
          SMOKE_AZURE_TENANT_ID: ${{ secrets.SMOKE_AZURE_TENANT_ID }}
          SMOKE_AZURE_CLIENT_ID: ${{ secrets.SMOKE_AZURE_CLIENT_ID }}
          SMOKE_AZURE_CLIENT_SECRET: ${{ secrets.SMOKE_AZURE_CLIENT_SECRET }}
          SMOKE_AZURE_API_SCOPE: ${{ secrets.SMOKE_AZURE_API_SCOPE }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
